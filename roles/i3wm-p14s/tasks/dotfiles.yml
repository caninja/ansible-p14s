---
# Note: Personal dotfiles are managed separately via repos and syncthing
# Note: This is just some bootstrap

- name: Ensure flameshot screenshots directory exists
  file:
    path: "/home/{{ user_name }}/Bilder/Screenshots"
    state: directory
    mode: '0755'
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
  tags: [dotfiles, config, flameshot]

- name: Ensure flameshot config directory exists
  file:
    path: "/home/{{ user_name }}/.config/flameshot"
    state: directory
    mode: '0755'
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
  tags: [dotfiles, config, flameshot]

- name: Configure flameshot
  template:
    src: flameshot.ini.j2
    dest: "/home/{{ user_name }}/.config/flameshot/flameshot.ini"
    mode: '0644'
    owner: "{{ user_name }}"
    group: "{{ user_name }}"
  tags: [dotfiles, config, flameshot]

- name: Ensure ranger config directory exists
  file:
    path: "/home/{{ user_name }}/.config/ranger"
    state: directory
    mode: '0755'
    owner: "{{ user_name }}"
